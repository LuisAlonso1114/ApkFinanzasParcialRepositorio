name: Build Android APK

# Se ejecuta al hacer push a main/master, en pull requests, y manualmente
# desde la pestaña "Actions" de GitHub (botón "Run workflow").
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm ci

      - name: Sincronizar proyecto Android con Capacitor
        run: npx cap sync android

      - name: Dar permisos de ejecución a gradlew
        run: chmod +x android/gradlew

      - name: Compilar APK debug
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Publicar APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: balance-app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
